<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿布的下载站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,system-ui}
        html,body{width:100%;min-height:100%;background:#f0f4f9;}
        
        /* 导航左右边距和参考站统一，不再左右偏移 */
        .header{
            width:100%;
            background:linear-gradient(135deg,#3671e9,#2050c9);
            padding: 12px 5%; /* 左右5%边距，和原版首页导航边距一致 */
            display:flex;
            align-items:center;
            gap: 12px;/*头像和文字间距固定12px*/
        }
        /* PC头像42px */
        .avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #fff;
        }
        /* PC标题24px + 加粗font-weight:bold */
        .header-text h1{
            color:#fff;
            font-size:24px;
            font-weight:bold;
            line-height:1.1;
        }

        /* 分类按钮 */
        .tab-box{
            width:90%;/*和导航左右边距同步5%，对齐头部*/
            margin:24px auto 10px;
            display:flex;
            gap:10px;
        }
        .tab-btn{
            flex:1;
            border:none;
            background:#ffffff;
            color:#2050c9;
            font-size:15px;
            padding:9px 0;
            border-radius:6px;
            cursor:pointer;
            position:relative;
        }
        .tab-btn.active::after{
            content:"";
            position:absolute;
            left:15%;
            right:15%;
            bottom:3px;
            height:18px;
            background:#dce8fc;
            border-radius:30px;
            z-index:0;
        }
        .tab-btn span{
            position:relative;
            z-index:1;
        }

        /* 资源列表和头部左右对齐 */
        #fileWrap{
            width:90%;
            margin:0 auto;
        }
        .file-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 0;
            border-bottom:1px solid #ddd;
        }
        .file-name{font-size:16px;color:#222}
        .download-btn{
            background:#3671e9;
            color:#fff;
            text-decoration:none;
            padding:9px 22px;
            border-radius:8px;
            transition:0.2s
        }
        .download-btn:hover{background:#2050c9}

        @media(max-width:768px){
            .header{padding:12px 5%;gap:10px}/*手机同样5%左右留白，对齐参考站*/
            .avatar{width:35px;height:35px}
            .header-text h1{font-size:18px;font-weight:bold;}
            .tab-box,#fileWrap{width:92%}
            .file-item{flex-direction:column;gap:12px;align-items:flex-start}
        }
    </style>
</head>
<body>
    <div class="header">
        <img class="avatar" src="IMG_20251109_114823.jpg" alt="头像">
        <div class="header-text">
            <h1>资源下载中心</h1>
        </div>
    </div>

    <div class="tab-box">
        <button class="tab-btn active" data-type="all"><span>全部资源</span></button>
        <button class="tab-btn" data-type="pc"><span>电脑资源</span></button>
        <button class="tab-btn" data-type="mobile"><span>手机资源</span></button>
        <button class="tab-btn" data-type="soft"><span>软件资源</span></button>
    </div>

    <div id="fileWrap"></div>

    <script>
        let fileData = [
            // {name:"示例文件.zip",url:"https://",type:"pc"}
        ]
        const wrap = document.getElementById('fileWrap')
        const tabs = document.querySelectorAll('.tab-btn')

        function render(type){
            wrap.innerHTML = ""
            let arr = type=="all"?fileData:fileData.filter(v=>v.type==type)
            arr.forEach(file=>{
                let div = document.createElement('div')
                div.className = 'file-item'
                div.innerHTML = `<span class="file-name">${file.name}</span><a href="${file.url}" target="_blank" class="download-btn">下载</a>`
                wrap.appendChild(div)
            })
        }
        render('all')

        tabs.forEach(btn=>{
            btn.onclick=()=>{
                tabs.forEach(b=>b.classList.remove('active'))
                btn.classList.add('active')
                render(btn.dataset.type)
            }
        })
    </script>
</body>
</html>
