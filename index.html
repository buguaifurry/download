<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿布的资源下载站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,system-ui}
        html,body{width:100%;min-height:100%;background:#f0f4f9;}
        /* 顶部蓝色导航 */
        .header{
            width:100%;
            background:linear-gradient(135deg,#3671e9,#2050c9);
            padding:14px 3%;
            display:flex;
            align-items:center;
            gap:14px;
        }
        .avatar{
            width:44px;
            height:44px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #fff;
        }
        .header-text h1{
            color:#fff;
            font-size:20px;
            font-weight:500;
        }
        /* 分类按钮区域 */
        .tab-box{
            width:96%;
            margin:24px auto 10px;
            display:flex;
            gap:10px;
        }
        .tab-btn{
            flex:1;
            border:none;
            background:#ffffff;
            color:#2050c9;
            font-size:15px;
            padding:9px 0;
            border-radius:6px;
            cursor:pointer;
            position:relative;
        }
        /* 选中文字底部浅蓝胶囊底色 */
        .tab-btn.active::after{
            content:"";
            position:absolute;
            left:15%;
            right:15%;
            bottom:3px;
            height:18px;
            background:#dce8fc;
            border-radius:30px;
            z-index:0;
        }
        .tab-btn span{
            position:relative;
            z-index:1;
        }
        /* 资源列表 */
        #fileWrap{
            width:96%;
            margin:0 auto;
        }
        .file-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 12px;
            border-bottom:1px solid #ddd;
        }
        .file-name{font-size:16px;color:#222}
        .download-btn{
            background:#3671e9;
            color:#fff;
            text-decoration:none;
            padding:9px 22px;
            border-radius:8px;
            transition:0.2s
        }
        .download-btn:hover{background:#2050c9}

        @media(max-width:768px){
            .header{padding:12px 4%;gap:10px}
            .avatar{width:38px;height:38px}
            .header-text h1{font-size:17px}
            .tab-box,#fileWrap{width:98%}
            .file-item{flex-direction:column;gap:12px;align-items:flex-start}
        }
    </style>
</head>
<body>
    <!-- 顶部蓝色导航 -->
    <div class="header">
        <img class="avatar" src="IMG_20251109_114823.jpg" alt="头像">
        <div class="header-text">
            <h1>资源下载中心</h1>
        </div>
    </div>

    <!-- 四个分类按钮 -->
    <div class="tab-box">
        <button class="tab-btn active" data-type="all"><span>全部资源</span></button>
        <button class="tab-btn" data-type="pc"><span>电脑资源</span></button>
        <button class="tab-btn" data-type="mobile"><span>手机资源</span></button>
        <button class="tab-btn" data-type="soft"><span>软件资源</span></button>
    </div>

    <!-- 文件列表 -->
    <div id="fileWrap"></div>

    <script>
        let fileData = [
            // {name:"示例文件.zip",url:"示例文件.zip",type:"pc"}
        ]
        const wrap = document.getElementById('fileWrap')
        const tabs = document.querySelectorAll('.tab-btn')

        // 渲染列表
        function render(type){
            wrap.innerHTML = ""
            let arr = type=="all"?fileData:fileData.filter(v=>v.type==type)
            arr.forEach(file=>{
                let div = document.createElement('div')
                div.className = 'file-item'
                div.innerHTML = `<span class="file-name">${file.name}</span><a href="${file.url}" download class="download-btn">下载</a>`
                wrap.appendChild(div)
            })
        }
        render('all')

        // 切换选中
        tabs.forEach(btn=>{
            btn.onclick=()=>{
                tabs.forEach(b=>b.classList.remove('active'))
                btn.classList.add('active')
                render(btn.dataset.type)
            }
        })
    </script>
</body>
</html>
